<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九がんばりドリル：極</title>
    <style>
        :root { --primary: #03a9f4; --secondary: #ff9800; --bg: #fffde7; --white: #ffffff; --gold: #ffd700; }
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; text-align: center; background-color: var(--bg); color: #333; margin: 0; padding: 10px; touch-action: manipulation; }
        .container { max-width: 600px; margin: 0 auto; background: var(--white); padding: 15px 20px; border-radius: 30px; border: 4px solid #ffd54f; }
        
        .timer-box { font-size: 1.5rem; font-family: monospace; background: #444; color: #0f0; padding: 5px 20px; border-radius: 10px; display: inline-block; margin-bottom: 5px; }
        .question { font-size: 4.5rem; margin: 5px 0; font-weight: bold; color: #2e7d32; position: relative; min-height: 5.5rem; line-height: 1.2; }
        #circle-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15rem; color: rgba(255, 0, 0, 0.7); display: none; pointer-events: none; }
        #hanamaru-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20rem; color: rgba(255, 0, 0, 0.8); display: none; pointer-events: none; z-index: 100; }

        /* 九九マスター演出用 */
        #master-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fff700, #ff9800);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; animation: flash 0.5s infinite alternate;
        }
        .master-text { font-size: 3.5rem; font-weight: bold; color: #fff; text-shadow: 0 0 20px #ff5722, 4px 4px 0 #bf360c; margin-bottom: 20px; }
        .master-sub { font-size: 1.8rem; color: #fff; font-weight: bold; background: rgba(0,0,0,0.2); padding: 10px 30px; border-radius: 50px; }
        @keyframes flash { from { filter: brightness(1); } to { filter: brightness(1.3); } }

        .answer-display { font-size: 4.5rem; color: #e91e63; background: #fce4ec; border-radius: 20px; min-height: 5.5rem; line-height: 5.5rem; margin-bottom: 10px; border: 5px solid #f06292; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 10px; }
        .num-btn { padding: 22px 0; font-size: 2.3rem; border: none; border-radius: 15px; background: #f5f5f5; box-shadow: 0 5px #ccc; border: 1px solid #ddd; }
        .num-btn:active { transform: translateY(4px); box-shadow: none; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .menu-btn { padding: 10px 5px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; box-shadow: 0 5px #0288d1; position: relative; font-size: 1rem; }
        .extra-btn { grid-column: span 3; background: #9c27b0; box-shadow: 0 6px #7b1fa2; margin-top: 8px; padding: 18px; font-size: 1.4rem; color: white; }
        
        .special-btn { grid-column: span 3; background: linear-gradient(45deg, #ff5252, #ffeb3b, #ff5252); background-size: 200% 200%; animation: rainbow 2s linear infinite; border-radius: 20px; padding: 25px; font-size: 1.8rem; color: #fff; font-weight: bold; border: none; margin-top: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: none; box-shadow: 0 8px #d84315; }
        @keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .medal-icon { font-size: 2.8rem; display: block; min-height: 3rem; }
        .best-label { display: block; font-size: 0.8rem; background: rgba(0,0,0,0.1); border-radius: 8px; padding: 2px 5px; }
        .mode-select { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .mode-btn { padding: 10px 15px; background: #fff; border: 2px solid #ddd; border-radius: 25px; font-size: 1rem; font-weight: bold; color: #666; }
        .mode-btn.active { background: var(--secondary); border-color: #f57c00; color: #fff; }
        .back-btn { margin-top: 15px; background: #90a4ae; color: white; padding: 15px; border: none; border-radius: 12px; width: 100%; font-size: 1.2rem; }
        .hidden { display: none; }
        h1 { font-size: 1.8rem; color: #f57c00; margin: 0 0 10px 0; }
        #unlock-hint { font-size: 0.9rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-screen">
        <h1>✨ 九九がんばりドリル ✨</h1>
        <div class="mode-select">
            <button id="mode-seq" class="mode-btn active" onclick="setMode('seq')">じゅんばん</button>
            <button id="mode-rev" class="mode-btn" onclick="setMode('rev')">ぎゃく</button>
            <button id="mode-rnd" class="mode-btn" onclick="setMode('rnd')">バラバラ</button>
        </div>
        <div class="menu-grid" id="dan-buttons"></div>
        <div class="menu-grid">
            <button class="menu-btn extra-btn" onclick="startGame(0)">
                <span id="extra-medal" class="medal-icon"></span>
                ぜんぶバラバラ（20もん）
                <span class="best-label" id="extra-best">きろく: --</span>
            </button>
        </div>
        <button id="special-mode-btn" class="special-btn" onclick="startGame(99)">
            🔥 超スペシャル（50問）
        </button>
        <div id="unlock-hint"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="timer-box" id="timer">00:00.00</div>
        <div id="q-count" style="font-weight:bold; color:#666;"></div>
        <div class="question" id="question-area">
            <span id="question-text">? × ? = </span>
            <div id="circle-overlay">⭕️</div>
        </div>
        <div class="answer-display" id="answer-display"></div>
        <div class="numpad">
            <button class="num-btn" onclick="inputNum(1)">1</button><button class="num-btn" onclick="inputNum(2)">2</button><button class="num-btn" onclick="inputNum(3)">3</button>
            <button class="num-btn" onclick="inputNum(4)">4</button><button class="num-btn" onclick="inputNum(5)">5</button><button class="num-btn" onclick="inputNum(6)">6</button>
            <button class="num-btn" onclick="inputNum(7)">7</button><button class="num-btn" onclick="inputNum(8)">8</button><button class="num-btn" onclick="inputNum(9)">9</button>
            <button class="num-btn" onclick="inputNum(0)">0</button>
            <button class="num-btn" style="grid-column: span 2;" onclick="clearInput()">けす</button>
        </div>
        <button class="back-btn" onclick="stopGame()">やめる</button>
    </div>
</div>

<!-- 九九マスター豪華演出画面 -->
<div id="master-overlay" onclick="closeMaster()">
    <div class="master-text">👑 九九マスター 👑</div>
    <div class="master-sub" id="master-time-label"></div>
    <p style="color: white; font-weight: bold; margin-top: 20px;">タップで もどる</p>
</div>

<div id="hanamaru-overlay">💮</div>

<script>
    let currentDan = 1, currentMode = 'seq', questions = [], qIndex = 0, userInput = "";
    let startTime, timerInterval;
    const danBestTimes = JSON.parse(localStorage.getItem('kukuFinalDataV4') || '{}');

    const THRESHOLDS = { danGold: 15, extraGold: 25, masterLimit: 60.00 };

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('mode-' + mode).classList.add('active');
        createMenu();
    }

    function createMenu() {
        const grid = document.getElementById("dan-buttons");
        grid.innerHTML = "";
        for(let i=1; i<=9; i++) {
            const btn = document.createElement("button");
            btn.className = "menu-btn";
            const best = danBestTimes[`${i}_${currentMode}`];
            const medal = getMedal(best, false);
            btn.innerHTML = `<span class="medal-icon">${medal}</span>${i}のだん<span class="best-label">きろく: ${best ? best.toFixed(2)+'s' : '--'}</span>`;
            btn.onclick = () => startGame(i);
            grid.appendChild(btn);
        }
        const eBest = danBestTimes[`extra`];
        document.getElementById("extra-medal").innerText = getMedal(eBest, true);
        document.getElementById("extra-best").innerText = `きろく: ${eBest ? eBest.toFixed(2)+'s' : '--'}`;
        checkSpecialUnlock();
    }

    function checkSpecialUnlock() {
        let goldCount = 0;
        ['seq', 'rev', 'rnd'].forEach(m => {
            for(let d=1; d<=9; d++) if (danBestTimes[`${d}_${m}`] <= THRESHOLDS.danGold) goldCount++;
        });
        if (danBestTimes[`extra`] <= THRESHOLDS.extraGold) goldCount++;

        const specialBtn = document.getElementById("special-mode-btn");
        const hint = document.getElementById("unlock-hint");
        if (goldCount >= 28) {
            specialBtn.style.display = "block";
            hint.innerText = "✨ おめでとう！伝説のモードが解放されたよ！ ✨";
        } else {
            specialBtn.style.display = "none";
            hint.innerText = `のこり ${28 - goldCount} つの金メダルで スペシャルがひらくよ！`;
        }
    }

    function getMedal(time, isExtra) {
        if (!time) return "";
        let gold = isExtra ? THRESHOLDS.extraGold : THRESHOLDS.danGold;
        if (time <= gold) return "🥇";
        if (time <= gold + 5) return "🥈";
        if (time <= gold + 10) return "🥉";
        return "🏁";
    }

    function startGame(dan) {
        currentDan = dan; userInput = ""; qIndex = 0; questions = [];
        if (dan === 0) {
            for(let i=0; i<20; i++) questions.push({d: Math.floor(Math.random()*9)+1, s: Math.floor(Math.random()*9)+1});
        } else if (dan === 99) {
            // 超スペシャル：全81通りからランダムに50問抽出
            let all = [];
            for(let d=1; d<=9; d++) for(let s=1; s<=9; s++) all.push({d: d, s: s});
            all.sort(() => Math.random() - 0.5);
            questions = all.slice(0, 50);
        } else {
            for(let i=1; i<=9; i++) questions.push({d: dan, s: (currentMode === 'rev') ? 10 - i : i});
            if(currentMode === 'rnd') questions.sort(() => Math.random() - 0.5);
        }
        
        updateQuestion();
        document.getElementById("menu-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        startTime = Date.now();
        timerInterval = setInterval(() => {
            document.getElementById("timer").innerText = ((Date.now() - startTime) / 1000).toFixed(2).padStart(5, '0');
        }, 10);
    }

    function updateQuestion() {
        const q = questions[qIndex];
        document.getElementById("question-text").innerText = `${q.d} × ${q.s} = `;
        document.getElementById("q-count").innerText = `${qIndex + 1} / ${questions.length}`;
        document.getElementById("answer-display").innerText = "";
    }

    function inputNum(num) {
        userInput += num.toString();
        document.getElementById("answer-display").innerText = userInput;
        const q = questions[qIndex];
        const correct = q.d * q.s;
        if (userInput.length >= correct.toString().length) {
            if (parseInt(userInput) === correct) showCircle();
            else {
                userInput = "";
                document.getElementById("answer-display").innerText = "×";
                setTimeout(() => { document.getElementById("answer-display").innerText = ""; }, 200);
            }
        }
    }

    function showCircle() {
        const circle = document.getElementById("circle-overlay");
        circle.style.display = "block";
        setTimeout(() => {
            circle.style.display = "none";
            userInput = ""; qIndex++;
            if (qIndex >= questions.length) finishGame(); else updateQuestion();
        }, 180);
    }

    function finishGame() {
        clearInterval(timerInterval);
        const time = (Date.now() - startTime) / 1000;
        
        // 記録保存
        const key = (currentDan === 0) ? `extra` : (currentDan === 99) ? `special` : `${currentDan}_${currentMode}`;
        if (!danBestTimes[key] || time < danBestTimes[key]) {
            danBestTimes[key] = time;
            localStorage.setItem('kukuFinalDataV4', JSON.stringify(danBestTimes));
        }

        // 超スペシャルかつ60秒以内の場合、豪華演出
        if (currentDan === 99 && time <= THRESHOLDS.masterLimit) {
            const masterOverlay = document.getElementById("master-overlay");
            document.getElementById("master-time-label").innerText = `タイム: ${time.toFixed(2)}びょう`;
            masterOverlay.style.display = "flex";
        } else {
            document.getElementById("hanamaru-overlay").style.display = "block";
            setTimeout(() => {
                document.getElementById("hanamaru-overlay").style.display = "none";
                alert(`タイム: ${time.toFixed(2)}びょう`);
                stopGame();
            }, 1500);
        }
    }

    function closeMaster() {
        document.getElementById("master-overlay").style.display = "none";
        stopGame();
    }

    function stopGame() {
        clearInterval(timerInterval);
        document.getElementById("menu-screen").classList.remove("hidden");
        document.getElementById("game-screen").classList.add("hidden");
        createMenu();
    }

    function clearInput() { userInput = ""; document.getElementById("answer-display").innerText = ""; }
    createMenu();
</script>

</body>
</html>
